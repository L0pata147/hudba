name: Build installers

# Builds a Windows installer and an Android APK and publishes them as a
# GitHub pre-release called "Latest build", so they can be downloaded
# directly (no ZIP artifacts, no developer tools needed).
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/navidrome-music-app-x6c89x']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sonora/desktop tauri build --bundles nsis,msi
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe out/Sonora-Setup-Windows.exe
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi out/Sonora-Windows.msi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: apps/mobile/android
        # Release build signed with the template's debug key: installable by sideloading, not for Google Play.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: mkdir -p out && cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/Sonora-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish "Latest build" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build of commit ${{ github.sha }}.

            **Android:** download `Sonora-Android.apk` on the phone and open it (allow installing from this source when asked).
            **Windows:** download `Sonora-Setup-Windows.exe` (or the `.msi`) and run it. SmartScreen may warn because the installer is not code-signed — choose *More info → Run anyway*.
          files: dist/*

name: Build installers

# Builds a Windows installer and an Android APK and publishes them as a
# GitHub pre-release called "Latest build", so they can be downloaded
# directly (no ZIP artifacts, no developer tools needed).
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/navidrome-music-app-x6c89x']
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Version and update signing
        # Every build gets a higher version so installed apps see it as an update.
        # Update files are only produced when the signing key secret exists.
        shell: bash
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          node -e "
            const fs = require('fs');
            const f = 'apps/desktop/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(f, 'utf8'));
            c.version = '0.2.${{ github.run_number }}';
            if (process.env.HAS_KEY !== 'true') c.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(f, JSON.stringify(c, null, 2));
          "
          if [ "$HAS_KEY" != "true" ]; then echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY is not set - building without auto-update files."; fi
      - run: pnpm --filter @sonora/desktop tauri build --bundles nsis,msi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe out/Sonora-Setup-Windows.exe
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi out/Sonora-Windows.msi
          sig=$(ls apps/desktop/src-tauri/target/release/bundle/nsis/*.exe.sig 2>/dev/null | head -1)
          if [ -n "$sig" ]; then
            # latest.json tells installed apps about this version (Tauri updater format).
            SIG_FILE="$sig" node -e "
              const fs = require('fs');
              fs.writeFileSync('out/latest.json', JSON.stringify({
                version: '0.2.${{ github.run_number }}',
                notes: 'Build of commit ${{ github.sha }}',
                pub_date: new Date().toISOString(),
                platforms: {
                  'windows-x86_64': {
                    signature: fs.readFileSync(process.env.SIG_FILE, 'utf8').trim(),
                    url: 'https://github.com/${{ github.repository }}/releases/download/latest-build/Sonora-Setup-Windows.exe',
                  },
                },
              }, null, 2));
            "
            cat out/latest.json
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: apps/mobile/android
        # Release build signed with the template's debug key: installable by sideloading, not for Google Play.
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - run: mkdir -p out && cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk out/Sonora-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish "Latest build" pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest build
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            Automatic build of commit ${{ github.sha }}.

            **Android:** download `Sonora-Android.apk` on the phone and open it (allow installing from this source when asked).
            **Windows:** download `Sonora-Setup-Windows.exe` (or the `.msi`) and run it. SmartScreen may warn because the installer is not code-signed — choose *More info → Run anyway*. Once installed, Sonora updates itself from this release (Settings → About → Updates).
          files: dist/*
